name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo l'esecuzione piu' recente per ogni ref. Se pushi 3 volte di fila,
# le prime 2 vengono cancellate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: safety + lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Var minime per soddisfare la validazione Zod in src/lib/env.ts.
    # `LLM_PROVIDER=ollama` evita il check su GOOGLE_AI_API_KEY: i test CI
    # non chiamano il provider LLM remoto.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      LLM_PROVIDER: ollama
      NODE_ENV: test
      # Secret HMAC per i cookie player. In CI un valore noto e' sufficiente:
      # i test E2E creano comunque player con codici individuali.
      SHERDAN_PLAYER_ACCESS_CODE: ci-fallback-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: env:check (sync .env.example <-> Zod schema)
        run: pnpm env:check

      - name: content:check:safe (fail on public Sherdan markdown)
        run: pnpm content:check:safe

      - name: Migrate database
        run: pnpm db:migrate

      - name: Ping database
        run: pnpm db:ping

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit)
        run: pnpm test

      - name: Test (integration)
        # Riusa lo stesso DB del service container CI (`ci`): le migration
        # sono gia' state applicate dallo step `Migrate database`, e
        # `truncateAll` ripulisce le tabelle prima di ogni test.
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (E2E smoke)
        # Avvia il dev server Next via Playwright `webServer` config,
        # usa lo stesso DB CI per applicare migration+TRUNCATE prima
        # del run. Smoke browser del flusso player + override.
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

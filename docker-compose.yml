services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sherdan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sherdan_dm}
      POSTGRES_USER: ${POSTGRES_USER:-sherdan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherdan_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sherdan_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sherdan} -d ${POSTGRES_DB:-sherdan_dm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sherdan_pg_data:
    name: sherdan_pg_data
